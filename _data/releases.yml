- slug: new-world
  title: A New World
  short: New World
  kind: EP
  intro: Videos from the "A New World" EP.
  credits: "Special thanks and credit: Freddy Tripp (keys, programmed drums and bass), Coleman Murphy (guitar), Tim Gordon (sax on Let Love Show)."
  videos:
    - id: gjP6tZjnsMU
      title: Change Gotta Come
      text: >-
        A song in deep reflection of our struggle with social divide, racial injustice and
        prejudices we must heal! After hearing of the horrific murder of Mr. George Floyd, I had
        to find a way to stand up for justice for my black and brown brothers and sisters. Enough
        is enough! Deep inside our hearts, we know we are all deserving of fair treatment
        regardless of the color of our skin. I have a dream too, this change will come!
    - id: 2Tg4TVe7PPQ
      title: A New World
      text: >-
        The morning I wrote "A New World", I had no idea I was even going to write a song. After
        my prayer and meditation, I went upstairs to work on music, and somehow got the "message".
        In two hours, it was written. Honestly, I just took dictation. It was truly a gift to me,
        and I hope it is a gift for you also. Still we must hold, in faith, in hope, in trust,
        that we will create a new, better "normal". Not only for ourselves, for the children.
    - id: MiJ-JdLU864
      title: Let Love Show
      text: Enjoy the bluesy saxophone on the original version of Let Love Show!
    - id: 6vg6DxIG-HU
      title: Shelter in Place
      text: >-
        We are all at home alone, together! This song was inspired by the enormous help it was
        to have Governor Cuomo there every day to update me on what the hey was going on out
        there, while I "sheltered in place" during the Covid-19 pandemic. We WILL get through
        this, together!

- slug: singles
  title: Singles
  short: Singles
  kind: Singles
  intro: Standalone singles, from the Soulful Summer Music Series to The Lord's Prayer.
  videos:
    - id: fltYTL8utxE
      title: Together We Stand
      text: >-
        Written to inspire unity, especially in America, Tamara's home she loves! The saxophone
        complements her smoky low vocals and the excellent musicians deliver a stellar performance
        on this upbeat tune. Let the craziness go for a minute and just enjoy the soulful, bluesy,
        jazzy upbeat vibes!
    - id: ROKIx9ycPMg
      title: Shine On
      text: A funky, upbeat dance song, and some fans say it's Tamara's best yet! The second release from the Soulful Summer Music Series.
    - id: kgT7nXEu8Yw
      title: Just a Little Time
      text: >-
        Take a moment, slow down, and let the smooth vibes wash over you. Featuring Jamie
        Hendrickson on guitar, Michael Tillis on drums, Thompson Knoles on piano and synth bass,
        and Ben Colvin on saxophone.
    - id: SLrN3ORgGow
      title: Life
      text: >-
        A catchy tune about life and how we are all tied to one another and the elements, set to
        a funky upbeat rhythm. Credit and thanks to Frankie Chancellor (piano, organ and mix),
        Jeff Zimmerman (guitar), Brian Haimbach (backup vocals), and Tom Kenyan for teaching
        "Chant of the Elements": El, Ka, Leem, Om (Earth, Fire, Water and Air).
      link: https://tamaralwilson.hearnow.com/life
    - id: IygUP0SQsAg
      title: The Lord's Prayer
      text: >-
        The music to The Lord's Prayer came to me out of the blue. Early one morning I awoke to
        the sound of music playing in my mind, and soon realized it was the music to The Lord's
        Prayer. I spent the next eight days, morning, noon and night, recording what I was hearing.
        With the help of my studio engineer, Tim Norris, it was ready for production. Tom Rule did
        an outstanding job on piano, Zack Crawford programmed an awesome hip-hop groove and brought
        it together in the mix, Joey Stuckey laid down bass, and Doug Diamond did the final polish
        with the mastering. Bringing the music to this powerful prayer to life is truly an honor.
    - id: rM-m-rqBj4k
      title: The Lord's Prayer (Instrumental)
      text: The instrumental version of The Lord's Prayer.
    - id: F257mesdBBs
      title: Freedom Flame
      text: >-
        To Peace, To Love, To Unity, To FREEDOM! Special thanks to Freddy Tripp (keys, programmed
        drums and bass), Coleman Murphy (guitar) and Tim Gordon (sax).
    - id: M2Dh6bFuN0g
      title: Little More Love
      text: An uplifting message of love and unity.
    - id: 7StYs-hwu3c
      title: Time
      text: '"Time is on our side" in this uplifting single.'
    - id: hkbUgS8jTpA
      title: I and the Father
      text: >-
        I so wanted to honor the Divine Feminine, and welcome again the Divine Masculine into my
        life. After praying to know the right words to say, "I and the Father" just seemed to flow
        with ease. The video is simply beautiful.
