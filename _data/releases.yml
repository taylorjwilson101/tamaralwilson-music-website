- slug: paradise
  title: Paradise
  short: Paradise
  kind: Album
  intro: Videos from the "Paradise" album.
  videos:
    - id: 87vTbr-lhWM
      title: Paradise
      text: Uplifting summer energy with a romantic vibe.
    - id: 37yK1LNqzZk
      title: Easy
      text: >-
        "Easy" was the first song I wrote about racial harmony. Growing up in the South,
        I saw prejudice up close and personal. Even as a little girl, I felt strongly that
        there was no room for it in my life. Now, thankfully, so many people have overcome
        this hatred. So let's cut off that TV a minute, relax. How 'bout a little harmony?
