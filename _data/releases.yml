- slug: pop-collection
  title: Pop Collection Remastered
  short: Pop Collection
  kind: Album
  cover: /images/pop-collection-cover.jpg
  buy: https://tamaralwilson.hearnow.com/pop-collection
  intro: >-
    Eighteen of Tamara's best, remastered and gathered in one place: soulful pop,
    R&B, samba, bossa and funk with a message of love.
  tracklist:
    - You and Me
    - Feel for You
    - Easy
    - Everything to Me
    - Let Love Show (Samba Remix)
    - Why
    - Shine On
    - Paradise
    - Just a Little Time
    - Talkin' to You
    - Your Own Kind of Beautiful
    - Love Plan
    - All About Love
    - Chemistry
    - Together We Stand
    - Little More Love Remix
    - Let It Go
    - Outside Lookin' In Remix
  credit_images:
    - src: /images/pop-credits-1.jpg
      alt: "Pop Collection credits, part 1: musicians for You and Me; Feel for You, Easy, Paradise and Everything to Me; Let Love Show (Samba Remix); Why and Little More Love Remix; Shine On, Just a Little Time and Together We Stand"
    - src: /images/pop-credits-2.jpg
      alt: "Pop Collection credits, part 2"
  videos:
    - id: cbu5mu8H1_I
      title: You and Me
      text: Tamara L. Wilson brings you a new sultry hit and the lyric video for "You and Me". We hope you enjoy the beautiful vocals and soothing instrumentals.
    - id: FDhKxOqNy9U
      title: Feel for You
      text: A jazzy beat that talks about overcoming the difficulties of a long-distance relationship and enjoying the time you have together.
    - id: 7tsvaf3xYBM
      title: Everything to Me
      text: Here's a light-hearted romantic song, just perfect to share with your special loved one... keep your love alive!
    - id: Pq9z9OEnXa8
      title: Let Love Show (Samba Remix)
      text: Tamara has masterfully remixed this song with a great up-tempo samba groove for your enjoyment.
    - id: Jxj40Qz9pu0
      title: Why
      text: This R&B/Pop crossover song features Macon, GA's blind blues guitar legend Joey Stuckey, who plays and programs every instrument as Tamara takes us on a journey with her soulful vocals; leading us back to the melodies of our heart and soul. "Why" can't love have the last word?
    - id: 37yK1LNqzZk
      title: Easy
      text: We, oftentimes, get so busy with the complexities of life that we don't make much time to just take it easy. I wrote this song to help you with that! De-stress while listening to this relaxing, uplifting song.
    - id: 87vTbr-lhWM
      title: Paradise
      text: Uplifting summer energy with a romantic vibe.
    - id: kgT7nXEu8Yw
      title: Just a Little Time
      text: With her signature soulful vocals and heartfelt lyrics, Tamara delivers a moving message about love, patience, and the power of giving someone the space they need to grow. Sometimes all we need... is just a little time.
    - id: pGMgLRlWfTc
      title: Talkin' to You
      text: A soulful tune with beautiful vocals and heartfelt lyrics.
    - id: nloW898SKLI
      title: Your Own Kind of Beautiful
      text: Everyone is beautiful in their own way! This song celebrates that with heart and soul!
    - id: RemN5PknKGk
      title: Love Plan
      text: A song encouraging all of us to live a life full of love and to spread good vibes to everyone around us.
    - id: KoBAXSBWkBk
      title: All About Love
      text: A country/pop hit featuring the talented guest vocalist, Datrian Johnson.
    - id: H_T1uyJ1J44
      title: Chemistry
      text: A fun and upbeat song that celebrates the spark between lovers with jazzy instrumentals and soulful vocals.
    - id: fltYTL8utxE
      title: Together We Stand
      text: Written to inspire unity, especially in America, Tamara's home she loves! The saxophone complements her smoky low vocals on this upbeat tune.
    - id: S8MRWHdP3Fk
      title: Little More Love Remix
      text: A fun, upbeat, and inspirational dance song with an uplifting message of love and unity.
    - id: R72elF2Vmus
      title: Let It Go
      text: Whether it's stress from work or challenges in life, when you've done your best... time to Let It Go! Plug in this song for a ride!
    - id: Lmmi0ifdViE
      title: Outside Lookin' In (Remix)
      text: A fresh, energetic remix blending soulful vocals with infectious beats, an anthem for anyone who's ever felt like an outsider looking for their place in the world.
    - id: ROKIx9ycPMg
      title: Shine On
      text: A funky, upbeat dance song, and some fans say it's Tamara's best yet! The second release from Tamara's Soulful Summer Music Series.

