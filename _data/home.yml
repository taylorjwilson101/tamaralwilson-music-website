summer_singles:
  - id: fltYTL8utxE
    title: Together We Stand
    yt_title: Tamara L WIlson - Together We Stand (Lyric Video)
    text: "Patriotic lyric video for Tamara L Wilson's 'Together We Stand'.  This song was written to inspire unity; especially in America, Tamara's home she loves!   The saxophone compliments her smokey low vocals and the excellent musicians deliver a stellar performance on this upbeat tune.  This song's great message can lift you to stand tall and stand together!  Let the craziness go for a minute and just enjoy the soulful, bluesy, jazzy upbeat vibes to stir your body and soul!"
  - id: ROKIx9ycPMg
    title: Shine On
    yt_title: Tamara L Wilson - Shine On (Lyric Video)
    text: "'Shine On' is a funky, upbeat dance song sure to please as some fans have shared it's Tamara's best yet!  This song is the second release from Tamara's Soulful Summer Music Series...let the soulful, bluesy, funky, upbeat vibes from this tune stir your body and soul!"
  - id: kgT7nXEu8Yw
    title: Just A Little Time
    text: "Take a moment, slow down, and let the smooth vibes of “Just A Little Time” wash over you. With her signature soulful vocals and heartfelt lyrics, Tamara L. Wilson delivers a moving message about love, patience, and the power of giving someone the space they need to grow. Whether you’re in love, healing, or simply reflecting, this track is a beautiful reminder that sometimes all we need… is just a little time."

featuring: Featuring the incredible talents of Jamie Hendrickson on guitar, Michael Tillis on drums, Thompson Knoles on piano and synth bass, and Ben Colvin on saxophone.

life:
  id: SLrN3ORgGow
  title: Life Lyric Video
  title_hidden: true
  text: "Catchy tune about life and how we are all tied to one another and the elements set to a funky upbeat rhythm. Credit and Thanks to: Frankie Chancellor (piano, organ and mix), Jeff Zimmerman (Guitar), Brian Haimbach (Backup Vocals), & Tom Kenyan for teaching 'Chant of the Elements' El, Ka, Leem, Om (Earth, Fire, Water & Air)"
  link: https://tamaralwilson.hearnow.com/life

