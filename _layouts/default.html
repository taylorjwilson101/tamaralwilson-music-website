<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/images/favicon.png' | relative_url }}">
  {% seo %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="mobile-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only">Menu</span><span class="bars" aria-hidden="true"></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Main">
        <ul>
          <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}><span>Home</span></a></li>
          {% for r in site.data.releases %}
          <li><a href="{{ '/' | append: r.slug | relative_url }}" {% if page.release == r.slug %}aria-current="page"{% endif %}><span>{{ r.short }}</span></a></li>
          {% endfor %}
          <li class="has-sub">
            <button class="more-btn{% if page.url == '/about' or page.url == '/contact' %} current{% endif %}" aria-haspopup="true"><span>More</span></button>
            <ul class="sub">
              <li><a href="{{ '/about' | relative_url }}" {% if page.url == '/about' %}aria-current="page"{% endif %}>About</a></li>
              <li><a href="{{ '/contact' | relative_url }}" {% if page.url == '/contact' %}aria-current="page"{% endif %}>Contact</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-inner">
        <a class="yt-icon" href="{{ site.links.youtube }}" aria-label="YouTube">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
        </a>
        <p>Copyright &copy; {{ site.time | date: '%Y' }} Tamara L. Wilson Music - All Rights Reserved.</p>
      </div>
    </div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
