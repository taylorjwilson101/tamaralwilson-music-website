<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/images/favicon.png' | relative_url }}">
  {% seo %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Tamara L. Wilson</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only">Menu</span><span class="bars" aria-hidden="true"></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Main">
        <ul>
          <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a></li>
          <li><a href="{{ '/music' | relative_url }}" {% if page.url == '/music' or page.release %}aria-current="page"{% endif %}>Music</a></li>
          <li><a href="{{ '/about' | relative_url }}" {% if page.url == '/about' %}aria-current="page"{% endif %}>About</a></li>
          <li><a href="{{ '/contact' | relative_url }}" {% if page.url == '/contact' %}aria-current="page"{% endif %}>Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <p class="brand">Tamara L. Wilson Music</p>
        <p class="muted">Music is the strongest form of magic.</p>
      </div>
      <ul class="footer-links">
        <li><a href="{{ site.links.youtube }}">YouTube</a></li>
        <li><a href="{{ site.links.jango }}">Jango</a></li>
        <li><a href="{{ site.links.buy_pop_collection }}">Buy music</a></li>
        <li><a href="{{ '/contact' | relative_url }}">Contact</a></li>
      </ul>
      <p class="muted small">&copy; {{ site.time | date: '%Y' }} Tamara L. Wilson Music. All rights reserved.</p>
    </div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
